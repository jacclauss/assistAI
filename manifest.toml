# Pinned external dependencies.
#
# This file is the source of truth for the update watcher (phase 6). It diffs
# upstream releases against these pins and notifies the operator over Signal.
# Nothing is ever applied automatically.
#
# Digests are recorded on first pull. Until then `digest` is empty and the
# watcher treats the component as unverified.

[meta]
schema_version = 1

[images.gateway_base]
ref = "python:3.12-slim-bookworm"
digest = ""
platforms = ["linux/amd64", "linux/arm64"]
notes = "Base for the gateway image."

[images.signal_cli]
ref = "bbernhard/signal-cli-rest-api:0.100"
digest = ""
platforms = ["linux/amd64", "linux/arm64"]
priority = "high"
notes = """
Phase 2. Must run with MODE=json-rpc for real-time receive; MODE=normal makes
/v1/about look healthy while the receive WebSocket fails to upgrade.
Pinned to 0.100 (2026-06-11), not latest: the update watcher will flag newer
releases. High priority because upstream warns old signal-cli builds break as
Signal's server APIs change.
"""

[images.searxng]
ref = "searxng/searxng:latest"
digest = ""
platforms = ["linux/amd64", "linux/arm64"]
notes = "Phase 8. Metasearch backend for the web_search tool."

# Phase 8 at the earliest. Deferred: multi-gigabyte image, and Chromium needs
# shm_size >= 1gb or it dies mid-run.
# [images.renderer]
# ref = "mcr.microsoft.com/playwright/python:v0.0.0-noble"

# Model refs are sent to Fireworks with the provider prefix stripped. Verify any
# id against `GET /v1/models` before pinning: some are inferred from Fireworks'
# naming convention (decimal points become "p", e.g. glm-5.3 -> glm-5p3).

[models.primary]
provider = "fireworks"
ref = "accounts/fireworks/models/minimax-m3"
thinking = "disabled"
price_per_mtok = { input = 0.30, output = 1.20 }
context = 512_000
notes = """
Chosen for tool-calling reliability per dollar, which is the only capability
axis that matters for a broker-mediated agent: 70.1 on the BenchLM tool-use
suite (ahead of GPT-5.5 at 67.8) and 74.2 on MCP Atlas. Only 23B of 428B
parameters activate per token, so latency stays low enough for chat.

Not Kimi K2.6: 60.5 on the same tool-use suite, a history of non-standard
streaming tool-call deltas, and chain-of-thought leakage into visible content
on Fireworks. All three are disqualifying for this architecture.
"""

[models.quarantine]
provider = "fireworks"
ref = "accounts/fireworks/models/deepseek-v4-flash-0731"
price_per_mtok = { input = 0.22, output = 0.66 }
context = 1_000_000
notes = """
Reads untrusted page content and emits a schema-conformant object, nothing
else. Picked for native structured-output support, since schema conformance is
the whole job. The serverless id is the dated snapshot (0731); the undated
deepseek-v4-flash name is not callable.

Deliberately a different model lineage from models.primary. An injection
crafted against one family is less likely to also defeat an unrelated one;
sharing a model between the summarizer and the agent would make this layer
mostly decorative.
"""

# Evaluated in phase 3 against real tool schemas, once the broker exists.
# Benchmarks do not predict how a model handles our specific tools.
[models.candidates]
glm_5p3 = { ref = "accounts/fireworks/models/glm-5p3", input = 1.40, output = 4.40, note = "Strongest agentic scores (73.0 Toolathlon); vendor-run numbers, license unpublished" }
glm_5p2 = { ref = "accounts/fireworks/models/glm-5p2", input = 1.40, output = 4.40, note = "Confirmed MIT, proven, weaker tool use (59.9 Toolathlon)" }
kimi_k3 = { ref = "accounts/fireworks/models/kimi-k3", input = 3.00, output = 15.00, note = "Leads tool use outright (94.5 MCPMark); ~10x primary cost, custom license" }

[python]
version = "3.12"
lockfile = "uv.lock"
notes = "Application dependencies are pinned with hashes in uv.lock."
