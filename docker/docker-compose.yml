# Phase 2: gateway + signal-cli on a private network. No published ports.
# Phase 8: SearXNG + extract sidecar on a research network the gateway can
# reach, but they cannot reach signal-cli or the state volume. Extract does
# not load .env, so it never sees FIREWORKS_API_KEY.
#
# First-time Signal setup (link or register) runs through the gateway image so
# it can reach signal-cli without exposing 8080 on the LAN:
#   make signal-link
# Host-mode (`make run` talking to signal-cli) uses docker/compose.dev.yml,
# which binds 8080 to 127.0.0.1 only.
#
# Later services:
#   phase 8+  renderer (headless Chromium, needs shm_size >= 1gb)

name: assistai

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    image: assistai/gateway:local
    restart: unless-stopped
    depends_on:
      signal-cli:
        condition: service_healthy
      searxng:
        condition: service_started
      extract:
        condition: service_started
    env_file:
      - ../.env
    environment:
      ASSISTAI_SIGNAL_BASE_URL: http://signal-cli:8080
      ASSISTAI_STATE_DIR: /app/state
      ASSISTAI_MANIFEST_PATH: /app/manifest.toml
      ASSISTAI_AGENTS_CONFIG: /app/config/assistai.toml
      ASSISTAI_SEARXNG_BASE_URL: http://searxng:8080
      ASSISTAI_EXTRACT_BASE_URL: http://extract:8080
      ASSISTAI_CALDAV_PASSWORD_FILE: /run/assistai/caldav-password
    networks:
      - internal
      - research
    volumes:
      - gateway-state:/app/state
      - ../manifest.toml:/app/manifest.toml:ro
      - ../config:/app/config:ro
      # Calendar app-specific password. Leave this pointed at /dev/null until
      # the Pi has a mode-600 file outside the repo. `make run` on a Mac uses
      # the Keychain and does not read this mount. Do not put the password in
      # the project directory.
      - ${ASSISTAI_CALDAV_PASSWORD_FILE:-/dev/null}:/run/assistai/caldav-password:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The Pi has 8 GB for the whole stack. A limit turns a runaway page into a
    # restarted container instead of an OOM killer picking a victim at random.
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  extract:
    image: assistai/gateway:local
    restart: unless-stopped
    command: ["extract"]
    # No env_file: this process parses hostile HTML and must never hold
    # FIREWORKS_API_KEY or touch the state volume.
    environment:
      ASSISTAI_LOG_LEVEL: info
    networks:
      - research
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    # The image rewrites the placeholder secret in settings.yml on boot, which
    # is why this mount stays writable. Override SEARXNG_SECRET in .env.
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-assistai-internal-no-published-ports}
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - research
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
      - MKNOD
      - AUDIT_WRITE
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  signal-cli:
    image: bbernhard/signal-cli-rest-api:0.100
    restart: unless-stopped
    environment:
      MODE: json-rpc
    volumes:
      - signal-cli-config:/home/.local/share/signal-cli
    networks:
      - internal
    # json-rpc mode boots the JVM before it listens. start_period covers that
    # so the gateway is not started against a socket that is not up yet.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    # Writes account keys to the volume; do not make this service read-only.
    # The image chowns that volume on start, so it cannot drop CHOWN/FOWNER.
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
      - MKNOD
      - AUDIT_WRITE
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # No published ports. Nothing in this stack is reachable from the LAN;
  # operator access is over SSH or a tailnet to loopback.
  internal:
    driver: bridge
  # Gateway can call SearXNG and extract. Neither can reach signal-cli or the
  # state volume. They share a bridge with the gateway, which is what lets the
  # gateway call them; the gateway publishes no port on it, so there is nothing
  # for them to connect back to.
  research:
    driver: bridge

volumes:
  gateway-state:
  signal-cli-config:
