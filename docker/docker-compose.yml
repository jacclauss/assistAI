# Phase 2: gateway + signal-cli on a private network. No published ports.
#
# First-time Signal setup (link or register) runs through the gateway image so
# it can reach signal-cli without exposing 8080 on the LAN:
#   make signal-link
# Host-mode (`make run` talking to signal-cli) uses docker/compose.dev.yml,
# which binds 8080 to 127.0.0.1 only.
#
# Later services:
#   phase 5  searxng + fetch/extract on an egress-restricted network
#   phase 8  renderer (headless Chromium, needs shm_size >= 1gb)

name: assistai

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    image: assistai/gateway:local
    restart: unless-stopped
    depends_on:
      signal-cli:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      ASSISTAI_SIGNAL_BASE_URL: http://signal-cli:8080
      ASSISTAI_STATE_DIR: /app/state
      ASSISTAI_MANIFEST_PATH: /app/manifest.toml
      ASSISTAI_AGENTS_CONFIG: /app/config/assistai.toml
    networks:
      - internal
    volumes:
      - gateway-state:/app/state
      - ../manifest.toml:/app/manifest.toml:ro
      - ../config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  signal-cli:
    image: bbernhard/signal-cli-rest-api:0.100
    restart: unless-stopped
    environment:
      MODE: json-rpc
    volumes:
      - signal-cli-config:/home/.local/share/signal-cli
    networks:
      - internal
    # json-rpc mode boots the JVM before it listens. start_period covers that
    # so the gateway is not started against a socket that is not up yet.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    # Writes account keys to the volume; do not make this service read-only.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # No published ports. Nothing in this stack is reachable from the LAN;
  # operator access is over SSH or a tailnet to loopback.
  internal:
    driver: bridge

volumes:
  gateway-state:
  signal-cli-config:
