[project]
name = "assistai"
version = "0.0.0"
description = "Self-hosted multi-agent assistant over Signal, backed by Fireworks AI"
requires-python = ">=3.12"

# Kept deliberately short. Every entry here is attack surface; justify additions
# in the pull request that adds them. Exact versions and hashes live in uv.lock.
dependencies = [
    "httpx>=0.27",  # async HTTP + SSE to Fireworks; no SDK, we own the wire format
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "websockets>=14",  # json-rpc receive is WebSocket-only; polling drops messages
]

[project.scripts]
assistai = "assistai.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: hits the real Fireworks API; skipped unless ASSISTAI_LIVE=1",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
