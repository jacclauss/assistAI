# Agent definitions and tool ACLs.
#
# Copy to config/assistai.toml (gitignored) and put real numbers in. The
# gateway refuses to start Signal without that file: two people texting the
# bot must reach two different agents.
#
# Being on ASSISTAI_SIGNAL_ALLOW_FROM is not enough to get an agent. That list
# is who may talk to the bot; this file decides who they become. Every agent
# binds to a Signal DM. There is no organizer on this roster: when it exists
# it will be a process, not a number anyone texts.

[signal]
# These are still read from the environment (ASSISTAI_SIGNAL_*), not this
# file. They stay here so the permission model is reviewable in one place.
#
# Dedicated bot number, never a personal one: signal-cli ignores messages from
# its own account, so a personal number cannot text its own assistant.
account = "+15555550100"
dm_policy = "allowlist"

# Operators. Only these numbers may talk to the bot. Pairing is off by default:
# unknown numbers hear nothing. If you set dm_policy to pairing, only these
# numbers may approve a code with /approve NNNNNN, and pairing still does not
# give the admitted number an agent until a binding below names it.
allow_from = ["+15555550101", "+15555550102"]

# web_access defaults to false. Only the two personal agents opt in; research
# tools are still refused unless they also appear on `tools`.

[agents.jacob]
binds_to = { channel = "signal", peer = "+15555550101" }
reads = ["own", "shared"]
writes = []
tools = ["get_time", "relay", "job_create", "job_list", "job_cancel", "job_reschedule", "web_search", "web_fetch", "calendar_today"]
web_access = true

[agents.spouse]
binds_to = { channel = "signal", peer = "+15555550102" }
reads = ["own", "shared"]
writes = []
tools = ["get_time", "relay", "job_create", "job_list", "job_cancel", "job_reschedule", "web_search", "web_fetch", "calendar_today"]
web_access = true

[broker]
# Once an untrusted tool result enters a conversation, unstaged sinks are
# refused before execution. Staging tools still propose; the person confirms
# the stored call, and a proposal made under taint says so. Relay is a
# staged tool named `relay`, not a free message:other_peer sink.
tainted_sinks_denied = ["shared:write", "shared:publish", "message:other_peer"]

# Untrusted content is placed mid-prompt: models attend most strongly to the
# head and tail of context, which is where injected instructions land hardest.
untrusted_content_position = "middle"
boundary_nonce = "per_process_random"
